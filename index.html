<style>
  /* الألوان: بورجوندي غامق / عنابي / مشمشي / كريمي / وردي هادي */
  :root {
    --ink: #2a1018;
    --dusk: #5b2a3d;
    --apricot: #ff9d7a;
    --cream: #fff1d6;
    --rose: #f2b8c6;
    --card: rgba(255,241,214,.06);
    --line: rgba(255,241,214,.16);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: radial-gradient(70% 45% at 90% 100%, rgba(255,157,122,.13), transparent 70%), radial-gradient(120% 90% at 50% 0%, var(--dusk) 0%, var(--ink) 65%);
    background-attachment: fixed;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before, .page::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .09; background-image: var(--grain); }
  .rq { font-family: 'El Messiri', sans-serif; }
  svg { display: block; fill: currentColor; }

  /* الرئيسية */
  .home { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 72px 24px 64px; }
  h1 { font-family: 'El Messiri', sans-serif; font-weight: 700; font-size: clamp(34px, 9vw, 50px); line-height: 1.5; text-align: center; color: var(--cream); }
  .subtitle { text-align: center; font-size: 16px; opacity: .8; margin: 6px 0 34px; line-height: 1.9; }

  .menu { border-top: 1px solid var(--line); }
  .choice {
    width: 100%; display: flex; align-items: center; gap: 16px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 20px 4px; cursor: pointer; text-align: right;
    font-family: inherit; color: inherit; transition: background .2s;
  }
  .choice:hover { background: var(--card); }
  .choice .hrt { width: 16px; height: 16px; color: var(--rose); flex: none; }
  .choice .txt { flex: 1; }
  .choice .title { font-family: 'El Messiri', sans-serif; font-weight: 700; font-size: 23px; line-height: 1.5; }
  .choice .desc { font-size: 14px; opacity: .65; }
  .choice .chev { font-size: 26px; opacity: .45; flex: none; }
  .choice:focus-visible, .back:focus-visible, .cta:focus-visible, .friend:focus-visible, .back2:focus-visible { outline: 3px solid var(--apricot); outline-offset: 3px; }

  /* صفحة المحتوى */
  .page {
    position: fixed; inset: 0; z-index: 5; overflow-y: auto; display: none;
    background: radial-gradient(120% 90% at 50% 0%, var(--dusk) 0%, var(--ink) 75%);
    animation: fadeIn .3s ease;
  }
  .page.open { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .page-inner { max-width: 560px; margin: 0 auto; padding: 24px 24px 72px; }

  .back {
    position: sticky; top: 8px; z-index: 3;
    background: rgba(42,16,24,.8); color: var(--cream);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px;
    font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    margin-bottom: 18px; backdrop-filter: blur(6px);
  }
  .page h2 { font-family: 'El Messiri', sans-serif; font-weight: 700; font-size: clamp(28px, 7vw, 38px); line-height: 1.5; margin: 4px 0 18px; }

  .letter {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 24px 22px; line-height: 2.1; font-size: 18px; white-space: pre-line;
  }

  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  @media (max-width: 420px) { .gallery { grid-template-columns: 1fr; } }
  .photo, .slide {
    position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 16px;
    aspect-ratio: 3/4; background: linear-gradient(160deg, rgba(242,184,198,.18), rgba(255,157,122,.12));
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    font-size: 14px;
  }
  .photo img, .photo video, .slide img, .slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { width: 44px; height: 44px; color: var(--rose); opacity: .7; }
  .cap {
    position: absolute; bottom: 0; inset-inline: 0; padding: 28px 14px 12px;
    background: linear-gradient(transparent, rgba(42,16,24,.8)); font-size: 15px; font-weight: 500;
  }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .list li {
    list-style: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 15px 18px; font-size: 16px; line-height: 1.9;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .list li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rose); margin-top: 11px; flex: none; }

  .cta {
    display: block; width: 100%; margin-top: 18px; background: var(--apricot); color: var(--ink);
    border: none; border-radius: 14px; padding: 15px; font-family: inherit; font-weight: 700; font-size: 18px;
    cursor: pointer; text-decoration: none; text-align: center;
  }
  .cta:active { transform: scale(.98); }
  .cta.wa { background: transparent; color: var(--cream); border: 1.5px solid var(--apricot); margin-top: 10px; }

  /* رسائل صوتية */
  .voices { display: flex; flex-direction: column; gap: 12px; }
  .voice { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .vt { font-family: 'El Messiri', sans-serif; font-weight: 700; font-size: 22px; }
  .vd { font-size: 14px; opacity: .7; margin: 0 0 10px; }
  audio { width: 100%; }
  .soon { font-size: 13px; opacity: .55; }

  /* اديني سبب */
  .reason-box {
    min-height: 190px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 18px; padding: 26px; background: var(--card);
  }
  .reason { font-weight: 600; font-family: 'El Messiri', sans-serif; font-size: 26px; line-height: 2; text-align: center; }
  .reason.pop { animation: pop .4s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

  /* الصحاب */
  .friends { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .friend {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 10px;
    color: inherit; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .friend:active { transform: scale(.97); }
  .av {
    position: relative; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; flex: none;
    background: var(--rose); color: var(--ink); display: flex; align-items: center; justify-content: center;
    font-family: 'El Messiri', sans-serif; font-weight: 700; font-size: 26px;
  }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fn { font-weight: 700; font-size: 16px; text-align: center; }
  .fc { font-size: 12px; opacity: .6; margin-top: -4px; }
  .back2 { background: none; border: none; color: var(--apricot); font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 14px; }
  .fmsg { margin-bottom: 14px; font-size: 16px; padding: 18px; }
  .fvoice { margin-bottom: 14px; }

  .carousel-wrap { position: relative; }
  .carousel { display: flex; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; gap: 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .carousel::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; }
  .dots { display: flex; justify-content: center; gap: 7px; margin-top: 14px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,241,214,.28); transition: all .2s; }
  .dots i.on { background: var(--apricot); width: 22px; border-radius: 6px; }

  .signature { margin-top: 28px; text-align: left; opacity: .65; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .page, .reason.pop { animation: none; }
  }
</style>
</head>

/* ============ من هنا تحت: الكود — مفيش داعي تعدّل فيه ============ */

const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cur = 0, rq = [], lastR = -1;

const menu = document.getElementById("menu");
SECTIONS.forEach((s, i) => {
  const el = document.createElement("button");
  el.className = "choice";
  el.innerHTML = `<span class="hrt">${HEART}</span>
    <span class="txt"><div class="title">${esc(s.title)}</div><div class="desc">${esc(s.desc)}</div></span>
    <span class="chev" aria-hidden="true">‹</span>`;
  el.onclick = () => openPage(i);
  menu.appendChild(el);
});

function mediaHTML(p, cls) {
  const inner = p.video
    ? `<video src="${esc(p.video)}" controls playsinline preload="metadata"></video>`
    : p.src
    ? `<img src="${esc(p.src)}" alt="${esc(p.caption || "")}" loading="lazy">`
    : `<span class="ph">${HEART}</span>`;
  const cap = p.caption ? `<div class="cap">${esc(p.caption)}</div>` : "";
  return `<div class="${cls}">${inner}${cap}</div>`;
}

function openPage(i) {
  const s = SECTIONS[i], b = s.body;
  cur = i; rq = [];
  document.getElementById("pgTitle").textContent = s.title;
  document.getElementById("pgSign").textContent = b.type === "cta" ? "" : SIGNATURE;

  let html = "";
  if (b.type === "letter") {
    html = `<div class="letter">${esc(b.text)}</div>`;
  } else if (b.type === "list") {
    html = `<ul class="list">` + b.items.map(x =>
      `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.text)}</a>` : esc(x.text)}</li>`
    ).join("") + `</ul>`;
  } else if (b.type === "gallery") {
    html = `<div class="gallery">` + b.photos.map(p => mediaHTML(p, "photo")).join("") + `</div>`;
  } else if (b.type === "voices") {
    html = `<div class="voices">` + b.items.map(v =>
      `<div class="voice"><div class="vt">${esc(v.title)}</div>` +
      (v.src ? `<audio controls preload="none" src="${esc(v.src)}"></audio>` : "") + `</div>`
    ).join("") + `</div>`;
  } else if (b.type === "reasons") {
    html = `<div class="reason-box"><div class="reason" id="rs">دوسي على الزرار</div></div>
            <button class="cta" onclick="nextReason()">اديني سبب</button>`;
  } else if (b.type === "friends") {
    html = `<div class="friends">` + b.friends.map((f, k) => {
      const first = f.photos.find(Boolean);
      return `<button class="friend" onclick="showFriend(${k})"><span class="av">${esc([...f.name][0])}${first ? `<img src="${esc(fpath(first, "images"))}" alt="" onerror="this.remove()">` : ""}</span>
        <span class="fn">${esc(f.name)}</span></button>`;
    }).join("") + `</div>`;
  } else if (b.type === "cta") {
    html = `<div class="letter">${esc(b.note)}</div>
            <a class="cta" href="tel:${esc(PHONE)}">${esc(b.text)}</a>
            <a class="cta wa" href="https://wa.me/${esc(PHONE.replace(/\D/g, ""))}" target="_blank" rel="noopener">${esc(b.wa)}</a>`;
  }

  document.getElementById("pgBody").innerHTML = html;
  const page = document.getElementById("page");
  page.classList.add("open");
  page.scrollTop = 0;
  document.body.style.overflow = "hidden";
}

function closePage() {
  document.querySelectorAll("#pgBody audio, #pgBody video").forEach(m => m.pause());
  document.getElementById("page").classList.remove("open");
  document.body.style.overflow = "";
}

function nextReason() {
  const list = SECTIONS[cur].body.reasons;
  if (!rq.length) {
    rq = list.map((_, k) => k).sort(() => Math.random() - .5);
    if (rq[rq.length - 1] === lastR && rq.length > 1) rq.unshift(rq.pop());
  }
  lastR = rq.pop();
  const el = document.getElementById("rs");
  el.textContent = list[lastR];
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

const fpath = (v, dir) => (v.includes("/") ? v : dir + "/" + v);
function friendSlides(f) {
  let h = "";
  (f.photos || []).filter(Boolean).forEach(v => {
    h += `<div class="slide"><img src="${esc(fpath(v, "images"))}" alt="" onerror="dropSlide(this)"></div>`;
  });
  (f.videos || []).filter(Boolean).forEach(v => {
    h += `<div class="slide"><video src="${esc(fpath(v, "videos"))}" controls playsinline preload="metadata" onerror="dropSlide(this)"></video></div>`;
  });
  return h;
}
function buildDots() {
  const car = document.getElementById("car"), d = document.getElementById("dots");
  if (!car || !d) return;
  const n = Math.round(Math.abs(car.scrollLeft) / car.clientWidth);
  d.innerHTML = [...car.children].map((_, j) => `<i class="${j === n ? "on" : ""}"></i>`).join("");
}
function dropSlide(el) {
  const sl = el.closest(".slide");
  if (sl) sl.remove();
  const car = document.getElementById("car");
  if (!car) return;
  if (!car.children.length) car.innerHTML = `<div class="slide"><span class="ph">${HEART}</span></div>`;
  buildDots();
}

function showFriend(k) {
  const f = SECTIONS[cur].body.friends[k];
  document.getElementById("pgTitle").textContent = f.name;
  document.getElementById("pgBody").innerHTML =
    `<button class="back2" onclick="openPage(${cur})">↩ كل الشلة</button>
     ${f.message ? `<div class="letter fmsg">${esc(f.message)}</div>` : ""}
     ${f.voice ? `<audio class="fvoice" controls preload="none" src="${esc(f.voice)}"></audio>` : ""}
     <div class="carousel-wrap">
       <div class="carousel" id="car">${friendSlides(f)}</div>
     </div>
     <div class="dots" id="dots"></div>`;
  const car = document.getElementById("car");
  buildDots();
  car.addEventListener("scroll", () => {
    const n = Math.round(Math.abs(car.scrollLeft) / car.clientWidth);
    [...document.querySelectorAll("#dots i")].forEach((d, j) => d.classList.toggle("on", j === n));
  }, { passive: true });
  document.getElementById("page").scrollTop = 0;
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePage(); });
